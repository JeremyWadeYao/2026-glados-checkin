name: GLaDOS 2026 Checkin

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      dispatch_source:
        description: 手动运行请选择 manual
        required: false
        default: manual
        type: choice
        options:
          - manual
          - external

concurrency:
  group: glados-checkin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checkin:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: python -m pip install requests

      - name: Run Checkin
        run: python checkin.py
        timeout-minutes: 8
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
          GLADOS_USER_AGENT: ${{ vars.GLADOS_USER_AGENT }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          PUSH_LEVEL: ${{ vars.PUSH_LEVEL || 'fail_only' }}
          EXCHANGE_PLAN: ${{ vars.EXCHANGE_PLAN || 'plan500' }}
          CHECKIN_MAX_ATTEMPTS: '3'
          CHECKIN_RETRY_DELAY_SECONDS: '60'
